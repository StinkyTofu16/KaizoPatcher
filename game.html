<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KaizoPatcher</title>
<link rel="manifest" href="manifest.webmanifest?v=7458c5a70a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KaizoPatcher">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Layout: the emulator fills the screen; one Menu button opens a sheet with speed, emulator options, New run and Quit. Single dark look. */
:root { --bg: #000; --bar: #0d1117; --panel: #161c25; --ink: #e4e9f0; --muted: #98a3b3; --line: #2e3845; --accent: #7d9bff; --accent-ink: #0d1422; --warn: #f0b75c; --bad: #ff8f86; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; overscroll-behavior: none; }
[hidden] { display: none !important; }
.shell { position: fixed; inset: 0; display: flex; flex-direction: column; }
.bar { flex: none; display: flex; align-items: center; gap: 12px; background: var(--bar);
  padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: 6px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.bar .info { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar .info b { color: var(--ink); font-weight: 600; }
.barbtn { font: 600 .88rem system-ui, -apple-system, sans-serif; color: var(--accent); background: transparent; border: 1.5px solid var(--line); border-radius: 8px; padding: 7px 12px; min-height: 36px; white-space: nowrap; cursor: pointer; }
.barbtn:focus-visible, .sheet button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.newtop { margin-left: auto; }
.barbtn.armed { background: var(--warn); border-color: var(--warn); color: var(--accent-ink); }
.speedtag { font: 700 .72rem system-ui, sans-serif; color: var(--accent-ink); background: var(--accent); border-radius: 99px; padding: 2px 8px; }
.stage { flex: 1; min-height: 0; position: relative; padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.gamebox { position: relative; width: 100%; height: 100%; }
#game { width: 100%; height: 100%; }
.msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); pointer-events: none; }
.msg.bad { color: var(--bad); }
.toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 1500; max-width: min(90%, 420px); background: rgba(13, 17, 23, .94);
  color: var(--ink); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 14px; font-size: .88rem; text-align: center; pointer-events: none; }

/* On-screen controller. Real sizes (no transforms: the D-pad reads touches from its own box size), proportional
   button positions, generous invisible touch margins, and high contrast so it reads over light game screens. */
#game { --zone: 168px; --pad-bottom: 46px; }
#game .ejs_virtualGamepad_parent { bottom: 8px !important; }
#game .ejs_virtualGamepad_left { width: var(--zone) !important; height: var(--zone) !important; bottom: var(--pad-bottom) !important; left: 10px !important; }
#game .ejs_virtualGamepad_right { width: var(--zone) !important; height: var(--zone) !important; bottom: var(--pad-bottom) !important; right: 10px !important; }
#game .ejs_virtualGamepad_button { background: rgba(8, 10, 14, .62) !important; border: 1.5px solid rgba(255, 255, 255, .9) !important; color: #fff !important;
  text-shadow: 0 1px 2px #000; display: flex !important; align-items: center; justify-content: center; line-height: 1 !important; }
#game .ejs_virtualGamepad_button_down { background: rgba(125, 155, 255, .75) !important; }
#game .b_a, #game .b_b { width: 42% !important; height: 42% !important; font-size: calc(var(--zone) * .2) !important; }
#game .b_select, #game .b_start, #game .b_l, #game .b_r { width: 46% !important; height: 34px !important; font-size: 15px !important; border-radius: 8px !important; }
#game .b_l, #game .b_r { font-size: 22px !important; }
#game .ejs_virtualGamepad_button::after { content: ""; position: absolute; inset: -12px; }
#game .ejs_dpad_main::after { content: ""; position: absolute; inset: -18px; }
#game .ejs_dpad_horizontal { height: 34% !important; }
#game .ejs_dpad_vertical { width: 34% !important; }
#game .ejs_dpad_main { opacity: .9 !important; }
#game .ejs_dpad_bar { background: rgba(8, 10, 14, .62) !important; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .9); }
#game .ejs_message { display: none !important; } /* the Fast/Slow tag in the bar already shows speed */
.runtag { display: none; }
/* The emulator's own toolbar and its corner icon stay hidden unless turned on from the Menu sheet. */
body:not(.kp-tools) .ejs_menu_bar { display: none !important; }
.ejs_virtualGamepad_open { display: none !important; }

/* Tracker (IronMON-style): lead Pokémon, stats, moves and the opponent, read live from the game. */
.trk { position: absolute; z-index: 5; background: rgba(14, 19, 26, .94); border: 1px solid #2c3746; border-radius: 10px; color: #e6ebf2;
  font: 11px/1.25 system-ui, -apple-system, sans-serif; padding: 7px 8px; display: flex; flex-direction: column; gap: 5px; overflow: hidden; pointer-events: none; }
.trk .hd { display: flex; align-items: center; gap: 6px; min-width: 0; }
.trk .nm { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trk .lv, .trk .num { font: 500 10.5px ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; color: #c9d2de; white-space: nowrap; }
.trk .lv { color: #98a3b3; font-weight: 600; }
.trk .ty { font: 700 9px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em; color: #fff; border-radius: 4px; padding: 1px 5px; text-shadow: 0 1px 1px rgba(0,0,0,.4); white-space: nowrap; }
.trk .st { font: 700 9px system-ui, sans-serif; color: #1d1600; background: #f0c75c; border-radius: 4px; padding: 1px 4px; }
.trk .hp { flex: 1; display: flex; align-items: center; gap: 5px; min-width: 50px; }
.trk .hpbar { flex: 1; height: 5px; background: #2a323d; border-radius: 3px; overflow: hidden; min-width: 20px; }
.trk .hpbar i { display: block; height: 100%; border-radius: 3px; }
.trk .stats { display: flex; flex-wrap: wrap; gap: 2px 9px; font: 500 10.5px ui-monospace, Menlo, monospace; color: #c9d2de; }
.trk b.k, .trk .ai b { color: #7f8a99; font-weight: 600; margin-right: 2px; }
.trk .plus { color: #6fd39c; } .trk .minus { color: #ff8f86; }
.trk .moves { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 6px; }
.trk .mv { display: flex; align-items: center; gap: 5px; background: #19212b; border-radius: 6px; padding: 3px 6px; min-width: 0; }
.trk .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.trk .mn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.trk .eff { font: 700 9.5px ui-monospace, Menlo, monospace; }
.trk .eff.x2 { color: #6fd39c; } .trk .eff.x05, .trk .eff.x0 { color: #ff8f86; } .trk .eff.x1 { color: #98a3b3; }
.trk .foe { display: flex; align-items: center; gap: 6px; color: #c9d2de; border-top: 1px solid #263040; padding-top: 4px; white-space: nowrap; overflow: hidden; }
.trk .k2 { color: #7f8a99; font-weight: 700; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; }
.trk .ai { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #c9d2de; }
.trk .empty { color: #98a3b3; font-size: 10.5px; line-height: 1.35; }
.trk.side { padding: 4px 6px; gap: 2px; font-size: 10px; border-radius: 8px; }
.trk.side .nm { font-size: 11px; }
.trk.side .num, .trk.side .lv { font-size: 9.5px; }
.trk.side .ty { font-size: 8px; padding: 0 4px; }
.trk .sgrid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 6px; font: 500 10px/1.3 ui-monospace, Menlo, monospace; color: #c9d2de; }
.trk .sgrid2 b { color: #7f8a99; font-weight: 600; margin-right: 3px; font-size: 9px; }
.trk .mv2 { background: #19212b; border-radius: 5px; padding: 2px 5px; }
.trk .mv2 .l1 { display: flex; align-items: center; gap: 4px; min-width: 0; }
.trk .mv2 .dot { width: 6px; height: 6px; }
.trk .mv2 .l2 { display: flex; gap: 6px; padding-left: 10px; }
#trkL, #trkR { display: none; }
#trkR, #trkU { pointer-events: auto; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.trk .seen { color: #98a3b3; font-style: italic; }
.trk .tabhint { color: #7f8a99; font-size: 8.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.lrbtn { display: none; }

/* DS games: two stacked screens (2:3). Upright, the picture sits above the controller; sideways, the side columns
   are sized for the narrower picture. The four face buttons share the right-hand zone. */
body.kp-ds #game .b_a, body.kp-ds #game .b_b, body.kp-ds #game .b_x, body.kp-ds #game .b_y { width: 36% !important; height: 36% !important; font-size: calc(var(--zone) * .15) !important; }
@media not ((orientation: landscape) and (max-height: 520px)) {
  body.kp-ds #game .ejs_canvas { height: calc(100% - 300px) !important; }
}
@media (orientation: landscape) and (max-height: 520px) {
  /* DS sideways: the two screens side by side, as big as fits above the controls; D-pad and face buttons tucked
     into the bottom corners; Menu / L / R / Select / Start / New run in one row at the bottom middle. */
  body.kp-ds #game { --zone: 116px; --pad-bottom: 0px; }
  body.kp-ds #game .ejs_canvas { left: 50% !important; right: auto !important; top: 0 !important; bottom: auto !important; transform: translateX(-50%);
    width: min(100%, calc((100dvh - 150px) * 8 / 3)) !important; height: auto !important; aspect-ratio: 8 / 3; }
  body.kp-ds #game .ejs_virtualGamepad_left { left: 6px !important; width: 116px !important; height: 116px !important; }
  body.kp-ds #game .ejs_virtualGamepad_right { right: 6px !important; }
  body.kp-ds #game .b_select, body.kp-ds #game .b_start { display: none !important; }
  body.kp-ds .bar { top: auto !important; bottom: 8px; left: 50% !important; right: auto !important; transform: translateX(-50%); padding: 0 !important; justify-content: center; width: max-content; gap: 5px; }
  body.kp-ds .bar .barbtn { padding: 0 9px; }
  body.kp-ds .dsbtn { display: inline-flex; font-size: .82rem !important; font-weight: 600 !important; }
  body.kp-ds #rBtn { margin-left: 0; }
  body.kp-ds .info, body.kp-ds #speedTag { display: none !important; }
}
#dsCoreBtn { display: none; }
.dsbtn { display: none !important; }
@media (orientation: landscape) and (max-height: 520px) { body.kp-ds .dsbtn { display: inline-flex !important; } }
body.kp-ds #dsCoreBtn { display: flex; }

/* Menu sheet */
.scrim { position: fixed; inset: 0; z-index: 2000; background: rgba(0, 0, 0, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(420px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px 16px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { margin: 0; font: 700 1.05rem system-ui, sans-serif; }
.sheet .sub { margin: -10px 0 0; color: var(--muted); font-size: .85rem; }
.label { font: 600 .72rem system-ui, sans-serif; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { font: 600 .95rem system-ui, sans-serif; color: var(--ink); background: transparent; border: 0; border-right: 1.5px solid var(--line); min-height: 44px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.sbtn { font: 600 1rem system-ui, sans-serif; width: 100%; min-height: 48px; border-radius: 10px; cursor: pointer; border: 1.5px solid var(--line); background: transparent; color: var(--ink); text-align: left; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; }
.sbtn small { color: var(--muted); font-weight: 500; font-size: .82rem; }
.sbtn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); justify-content: center; }
.sbtn.danger { color: var(--warn); }
.sbtn.armed { background: var(--warn); border-color: var(--warn); color: var(--accent-ink); }
.list { display: flex; flex-direction: column; gap: 8px; }
.hint { margin: 0; color: var(--muted); font-size: .8rem; }
.hint.ok { color: #6fd39c; }
.progress { margin: -6px 0 0; font-size: .86rem; color: var(--ink); }
.progress b { color: var(--accent); }

/* Phone held sideways: only a small Menu button in the top-left corner so the game gets the full height. */
@media (orientation: landscape) and (max-height: 520px) {
  /* Side columns only as wide as needed: at least 112px, or whatever is left beside a full-height 3:2 screen. */
  .gamebox { --side: max(116px, calc(50% - 75dvh)); }
  #game { --zone: 112px; --pad-bottom: 44px; }
  #game .ejs_virtualGamepad_left { left: max(3px, calc(var(--side) - var(--zone) - 3px)) !important; }
  /* Bigger D-pad (126px) on the left; L and R move up to the bar beside Menu and New run. */
  #game .ejs_virtualGamepad_left { width: 126px !important; height: 126px !important; left: max(3px, calc(var(--side) - 129px)) !important; }
  #game .b_l, #game .b_r { display: none !important; }
  .lrbtn { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; font-size: 1rem !important; font-weight: 700 !important; touch-action: none; -webkit-user-select: none; user-select: none; }
  .lrbtn.down { background: rgba(125, 155, 255, .75) !important; color: #0d1422 !important; }
  .bar { gap: 6px; }
  #rBtn { margin-left: auto; }
  #rBtn + .newtop { margin-left: 0; }
  /* Tracker panels in the side columns: stats top-left (above the D-pad), moves top-right (above A/B). */
  body.kp-trk #trkL, body.kp-trk #trkR { display: flex; }
  #trkL, #trkR { top: 44px; width: calc(var(--side) - 8px); }
  #trkL { left: 4px; bottom: 186px; }
  #trkR { right: 4px; bottom: 172px; }
  #trkU { display: none !important; }
  #game .ejs_virtualGamepad_right { right: max(3px, calc(var(--side) - var(--zone) - 3px)) !important; }
  #game .b_a, #game .b_b { width: 46% !important; height: 46% !important; }
  /* Narrow the game image so the controls get their own columns instead of covering the screen. */
  #game .ejs_canvas { position: absolute; top: 0; bottom: 0; left: var(--side); width: calc(100% - 2 * var(--side)) !important; height: 100% !important; }
  .runtag { display: inline; }
  .bar { position: absolute; top: 0; left: 0; right: 0; z-index: 1000; background: transparent; pointer-events: none; padding-top: 8px;
    padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
  .bar .info { display: none; }
  .barbtn { pointer-events: auto; background: rgba(13, 17, 23, .85); font-size: .78rem; padding: 4px 10px; min-height: 30px; }
  .sheet { border-radius: 16px; margin-bottom: 8px; max-height: calc(100% - 16px); }
  .scrim { align-items: center; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <button class="barbtn" id="menuBtn" aria-haspopup="dialog"><span class="runtag" id="runTag"></span>Menu</button>
    <button class="barbtn lrbtn" id="lBtn" aria-label="L button">L</button>
    <span class="info" id="info"></span>
    <span class="speedtag" id="speedTag" hidden></span>
    <button class="barbtn lrbtn" id="rBtn" aria-label="R button">R</button>
    <button class="barbtn lrbtn dsbtn" id="selBtn" aria-label="Select button">Select</button>
    <button class="barbtn lrbtn dsbtn" id="startBtn" aria-label="Start button">Start</button>
    <button class="barbtn newtop" id="newTopBtn">New run</button>
  </div>
  <div class="stage">
    <div class="gamebox">
      <div id="game"></div>
      <div class="trk side" id="trkL" aria-label="Tracker: your Pokémon"></div>
      <div class="trk side" id="trkR" aria-label="Tracker: moves"></div>
      <div class="trk" id="trkU" aria-label="Tracker" hidden></div>
      <div class="msg" id="msg">Loading your run…</div>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Paused</h2>
    <p class="sub" id="sheetSub"></p>
    <p class="progress" id="progressLine" hidden></p>
    <p class="hint" id="syncLine"></p>
    <div>
      <p class="label">Game speed</p>
      <div class="seg" role="group" aria-label="Game speed">
        <button id="spSlow" aria-pressed="false">Slow</button>
        <button id="spNormal" aria-pressed="true">Normal</button>
        <button id="spFast" aria-pressed="false">Fast</button>
      </div>
    </div>
    <div class="list">
      <button class="sbtn primary" id="resumeBtn">Resume</button>
      <button class="sbtn" id="dsCoreBtn">DS engine <small id="dsCoreState">Fast</small></button>
      <button class="sbtn" id="trkToggle">Tracker <small id="trkState">On</small></button>
      <button class="sbtn" id="toolsBtn">Emulator options <small id="toolsState">Save states, settings</small></button>
      <button class="sbtn" id="starterBtn">Use this save for new runs <small id="starterState">Skip the intro</small></button>
      <button class="sbtn" id="starterClearBtn" hidden>Remove starter save <small>New runs start from scratch</small></button>
      <p class="hint" id="starterHint">This happens automatically the first time you save in the game before getting a Pokémon (for example in your room after the intro). You can also save anywhere and tap this. New runs start from that save, with fresh randomized Pokémon.</p>
      <button class="sbtn danger" id="newBtn">New run <small>Re-randomize</small></button>
      <button class="sbtn" id="quitBtn">Quit to home <small>Progress is saved</small></button>
    </div>
  </div>
</div>

<script>
</script>
<script src="kp-store.js?v=7458c5a70a"></script>
<script src="kp-config.js?v=7458c5a70a"></script>
<script src="kp-gen3.js?v=7458c5a70a"></script>
<script src="kp-cloud.js?v=7458c5a70a"></script>
<script src="kp-tracker.js?v=7458c5a70a"></script>
<script src="kp-corecache.js?v=7458c5a70a"></script>
<script>
const EJS_VERSION_PATH = 'https://cdn.emulatorjs.org/4.2.3/data/';
(async () => {
  const $ = (id) => document.getElementById(id);
  let setup, run;
  let runRom = null, startSave = null;
  try {
    await KPStore.migrate();
    setup = await KPStore.get('setup'); run = await KPStore.get('run');
    runRom = await KPStore.get('runRom'); startSave = await KPStore.get('startSave');
  } catch (e) {}
  if (!setup || !run || !runRom) { location.replace('play.html'); return; }
  const saveRunMeta = () => KPStore.set('run', run).catch(() => {});
  const b = document.createElement('b'); b.textContent = 'Run #' + run.id;
  $('info').append(b, document.createTextNode(' · ' + run.preset));
  $('runTag').textContent = '#' + run.id + ' \u00b7 ';
  $('sheetSub').textContent = setup.label + ' · Run #' + run.id + ' · ' + run.preset;

  const emu = () => (window.EJS_emulator && EJS_emulator.started) ? EJS_emulator : null;
  let toastTimer = null;
  function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 5000); }
  const saveNow = () => { try { const e = emu(); e && e.gameManager.saveSaveFiles(); } catch (e) {} };

  // ---- Progress tracking: badges and party read from the in-game save ----
  // DS games: DeSmuME 2015 by default (the lightest DS engine, smoothest on phones); melonDS can be picked in the Menu.
  const isDS = setup.core === 'nds';
  let dsCore = 'desmume2015';
  try { if (localStorage.getItem('kp:dscore') === 'melonds') dsCore = 'melonds'; } catch (e) {}
  const gameCode = String.fromCharCode(...new Uint8Array(runRom, 0xAC, 4));
  if (!setup.key) { setup.key = Date.now().toString(36) + Math.random().toString(36).slice(2, 6); try { await KPStore.set('setup', setup); } catch (e) {} }
  const runInfo = { runKey: setup.key + '-' + run.id, game: gameCode, label: setup.label, preset: run.preset, runNo: run.id };
  let species = null, lastBackup = 0;
  fetch('gen3-species.json?v=7458c5a70a').then((r) => r.json()).then((j) => { species = j; }).catch(() => {});
  // Starter saves must come from before the first Pokémon, or every run would start with that same Pokémon.
  const hasParty = (buf) => { try { const p = KPGen3.read(buf, gameCode, null); return !!(p && p.party.length); } catch (e) { return false; } };
  if (startSave && hasParty(startSave)) { startSave = null; try { await KPStore.del('startSave'); } catch (e) {} }
  // The account service loads after the game is running, to keep memory free while the emulator starts.
  let cloudOn = false;
  function showSync() {
    const el = $('syncLine'), st = KPCloud.status;
    if (!cloudOn) { el.textContent = ''; return; }
    if (!KPCloud.user()) { el.className = 'hint'; el.textContent = 'Not signed in, so this run isn\u2019t on the leaderboard. Sign in from the Account page.'; return; }

      const gm = EJS_emulator.gameManager, path = gm.getSaveFilePath();
      let cp = '';
      for (const part of path.split('/').slice(0, -1)) { if (!part) continue; cp += '/' + part; if (!gm.FS.analyzePath(cp).exists) gm.FS.mkdir(cp); }
      if (gm.FS.analyzePath(path).exists) gm.FS.unlink(path);
      gm.FS.writeFile(path, new Uint8Array(startSave));
      gm.loadSaveFiles();
      gm.restart();
      run.seeded = true;
      saveRunMeta();
      toast('Started from your saved intro. Pick Continue on the title screen.');
    } catch (err) { console.error('Starter save failed', err); }
  }

  // ---- New run (two taps) and Quit ----
  let armed = false, armTimer = null;
  function disarm() { armed = false; clearTimeout(armTimer); $('newBtn').classList.remove('armed'); $('newBtn').firstChild.textContent = 'New run '; }
  function goNewRun(btn) {
    clearTimeout(armTimer); clearTimeout(topTimer); saveNow();
    $('newBtn').disabled = true; $('newTopBtn').disabled = true; btn.firstChild.textContent = 'Starting… ';
    trackSoon().then(() => (KPCloud.user() ? Promise.race([KPCloud.endRun(runInfo.runKey), new Promise((r) => setTimeout(r, 1500))]) : null))
      .catch(() => {}).finally(() => { location.replace('play.html?new=1'); });
  }
  let topArmed = false, topTimer = null;
  const disarmTop = () => { topArmed = false; clearTimeout(topTimer); $('newTopBtn').classList.remove('armed'); $('newTopBtn').textContent = 'New run'; };
  $('newTopBtn').addEventListener('click', () => {
    if (!topArmed) { topArmed = true; $('newTopBtn').classList.add('armed'); $('newTopBtn').textContent = 'Tap again'; topTimer = setTimeout(disarmTop, 4000); return; }
    goNewRun($('newTopBtn'));
  });
  $('newBtn').addEventListener('click', () => {
    if (!armed) {
      armed = true; $('newBtn').classList.add('armed'); $('newBtn').firstChild.textContent = 'Tap again to end run #' + run.id + ' ';
      armTimer = setTimeout(disarm, 4000); return;
    }
    goNewRun($('newBtn'));
  });
  $('quitBtn').addEventListener('click', () => { saveNow(); trackSoon().finally(() => { location.replace('play.html'); }); });

  // ---- Emulator ----
  window.EJS_player = '#game';
  window.EJS_core = isDS ? dsCore : setup.core;
  if (isDS) document.body.classList.add('kp-ds');
  window.EJS_gameUrl = new Blob([runRom]);
  window.EJS_gameName = 'kp-run-' + run.id;
  window.EJS_pathtodata = EJS_VERSION_PATH;
  // A tap on the start button counts as a user gesture, so iPhone lets the game play sound and it never auto-pauses.
  window.EJS_startOnLoaded = false;
  window.EJS_startButtonName = 'Tap to play';
  window.EJS_alignStartButton = 'center';
  window.EJS_language = 'en-US';
  window.EJS_disableAutoLang = false; // the loader treats false as "don't load a translation"
  window.EJS_color = '#7d9bff';
  window.EJS_backgroundColor = '#000000';
  window.EJS_defaultOptions = { 'save-save-interval': '30' };
  // DS: the touch screen follows the finger (absolute "touch" pointer), screens stacked upright and side by side sideways.
  const landNow = () => matchMedia('(orientation: landscape) and (max-height: 520px)').matches;
  const dsLayoutOpts = (land) => ({ desmume_screens_layout: land ? 'left/right' : 'top/bottom', melonds_screen_layout: land ? 'Left/Right' : 'Top/Bottom' });
  if (isDS) Object.assign(window.EJS_defaultOptions, { desmume_pointer_mouse: 'enabled', desmume_pointer_type: 'touch', desmume_frameskip: '0',
    melonds_touch_mode: 'Touch' }, dsLayoutOpts(landNow()));
  window.EJS_Buttons = { restart: false, netplay: false, exitEmulation: false, cacheManager: false, cheat: false };
  // Controller: Select centered under the D-pad, Start centered under A/B, each with a clear gap. Speed lives in the Menu sheet.
  const pad = isDS ? [
    // DS face buttons in the usual diamond: X top, Y left, A right, B bottom.
    { type: 'button', text: 'X', id: 'x', location: 'right', left: '32%', top: '0%', bold: true, input_value: 9 },
    { type: 'button', text: 'Y', id: 'y', location: 'right', left: '0%', top: '32%', bold: true, input_value: 1 },
    { type: 'button', text: 'A', id: 'a', location: 'right', left: '64%', top: '32%', bold: true, input_value: 8 },
    { type: 'button', text: 'B', id: 'b', location: 'right', left: '32%', top: '64%', bold: true, input_value: 0 },
    { type: 'dpad', id: 'dpad', location: 'left', left: '50%', top: '50%', joystickInput: false, inputValues: [4, 5, 6, 7] },
    { type: 'button', text: 'Select', id: 'select', location: 'left', left: '27%', top: 'calc(100% + 12px)', fontSize: 15, block: true, input_value: 2 },
    { type: 'button', text: 'Start', id: 'start', location: 'right', left: '27%', top: 'calc(100% + 12px)', fontSize: 15, block: true, input_value: 3 },
  ] : [
    { type: 'button', text: 'B', id: 'b', location: 'right', left: '0%', top: '52%', bold: true, input_value: 0 },
    { type: 'button', text: 'A', id: 'a', location: 'right', left: '54%', top: '12%', bold: true, input_value: 8 },
    { type: 'dpad', id: 'dpad', location: 'left', left: '50%', top: '50%', joystickInput: false, inputValues: [4, 5, 6, 7] },
    { type: 'button', text: 'Select', id: 'select', location: 'left', left: '27%', top: 'calc(100% + 12px)', fontSize: 15, block: true, input_value: 2 },
    { type: 'button', text: 'Start', id: 'start', location: 'right', left: '27%', top: 'calc(100% + 12px)', fontSize: 15, block: true, input_value: 3 },
  ];
  if (setup.core === 'gba' || isDS) pad.push(
    { type: 'button', text: 'L', id: 'l', location: 'left', left: '2%', top: 'calc(-34px - 22%)', bold: true, block: true, input_value: 10 },
    { type: 'button', text: 'R', id: 'r', location: 'right', right: '2%', top: 'calc(-34px - 22%)', bold: true, block: true, input_value: 11 });
  window.EJS_VirtualGamepadSettings = pad;
  // The on-screen controller must always be on for touch screens: undo a saved "Virtual Gamepad: off" in the
  // emulator's own settings, and show it again after the game starts if the emulator left it hidden.
  const touchScreen = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
  try {
    for (let k = 0; k < localStorage.length; k++) {
      const key = localStorage.key(k); if (!key || !key.startsWith('ejs')) continue;
      const v = localStorage.getItem(key);
      if (v && v.includes('"virtual-gamepad":"disabled"')) localStorage.setItem(key, v.replace('"virtual-gamepad":"disabled"', '"virtual-gamepad":"enabled"'));
    }
  } catch (e) {}
  function ensurePad() {
    if (!touchScreen) return;
    const e = emu();
    try { if (e && typeof e.toggleVirtualGamepad === 'function') e.toggleVirtualGamepad(true); } catch (err) {}
    const p = document.querySelector('#game .ejs_virtualGamepad_parent'); if (p && getComputedStyle(p).display === 'none') p.style.display = 'block';
  }
  // DS screen layout follows the phone's orientation.
  let dsLand = null;
  function applyDsLayout(force) {
    if (!isDS) return;
    const land = landNow(); if (!force && land === dsLand) return; dsLand = land;
    try { const e = emu(); if (e) for (const [k, v] of Object.entries(dsLayoutOpts(land))) e.gameManager.setVariable(k, v); } catch (err) { console.warn(err); }
    [50, 400].forEach((ms) => setTimeout(() => window.dispatchEvent(new Event('resize')), ms));
  }
  if (isDS) addEventListener('resize', () => applyDsLayout(false));
  // DS touch screen: the emulator reads the touch screen from mouse input, and iPhone only turns a tap into a brief
  // click, so finger touches on the game picture are passed on as a held mouse button that follows the finger.
  function setupDsTouch() {
    const cv = document.querySelector('#game canvas.ejs_canvas') || document.querySelector('#game canvas');
    if (!cv || cv.__kpTouch) return; cv.__kpTouch = true;
    const send = (type, t, down) => cv.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, clientX: t.clientX, clientY: t.clientY, screenX: t.screenX, screenY: t.screenY, button: 0, buttons: down ? 1 : 0 }));
    let id = null;
    cv.addEventListener('touchstart', (ev) => { const t = ev.changedTouches[0]; if (id !== null || !t) return; id = t.identifier; ev.preventDefault(); send('mousemove', t, false); send('mousedown', t, true); }, { passive: false });
    cv.addEventListener('touchmove', (ev) => { const t = [...ev.changedTouches].find((x) => x.identifier === id); if (!t) return; ev.preventDefault(); send('mousemove', t, true); }, { passive: false });
    const end = (ev) => { const t = [...ev.changedTouches].find((x) => x.identifier === id); if (!t) return; ev.preventDefault(); send('mouseup', t, false); id = null; };
    cv.addEventListener('touchend', end, { passive: false }); cv.addEventListener('touchcancel', end, { passive: false });
  }
  window.EJS_ready = () => { $('msg').hidden = true; };
  window.EJS_onGameStart = () => {
    $('msg').hidden = true;
    [300, 1500, 4000].forEach((ms) => setTimeout(ensurePad, ms));
    if (isDS) { setupDsTouch(); applyDsLayout(true); }
    // Only a run's very first launch gets the starter save; later launches (Continue) keep the run's own progress.
    if (!run.launched) { seedStarter(); run.launched = true; saveRunMeta(); }
    reapplySpeed();
    setTimeout(track, 5000);
    setTimeout(startCloud, 8000);
    // Make the emulator size its drawing buffer to the (possibly narrowed) screen right away.
    [0, 300, 1000].forEach((ms) => setTimeout(() => window.dispatchEvent(new Event('resize')), ms));
  };
  const sc = document.createElement('script');
  sc.src = EJS_VERSION_PATH + 'loader.js';
  sc.onerror = () => { $('msg').className = 'msg bad'; $('msg').textContent = 'Couldn’t load the game player. Check your connection and reload.'; };
  document.body.append(sc);
  // Turn off RetroArch's on-screen notices ("Fast-Forward." in the corner), which are drawn inside the game picture.
  // The player writes its settings file from getRetroArchCfg() when the game starts, so add two lines to it.
  const cfgPoll = setInterval(() => {
    if (typeof EJS_GameManager === 'undefined') return;
    clearInterval(cfgPoll);
    try { KPCoreCache.install(); } catch (e) { console.warn(e); }
    if (EJS_GameManager.prototype.__kpCfg) return;
    const orig = EJS_GameManager.prototype.getRetroArchCfg;
    EJS_GameManager.prototype.getRetroArchCfg = function () {
      return orig.call(this) + 'notification_show_fast_forward = "false"\nvideo_font_enable = "false"\n';
    };
    EJS_GameManager.prototype.__kpCfg = true;
  }, 5);
  setTimeout(() => clearInterval(cfgPoll), 120000);
  setTimeout(() => { if (!$('msg').classList.contains('bad')) $('msg').hidden = true; }, 4000);
  // If the player stalls after Tap to play (e.g. stuck at "Decompress Game Core 99%", when iPhone Safari's storage
  // hangs), offer a Reload button instead of leaving the screen stuck.
  let gameStarted = false, stallTimer = null;
  const prevStart = window.EJS_onGameStart;
  window.EJS_onGameStart = (...a) => { gameStarted = true; clearTimeout(stallTimer); const s = document.getElementById('kpStall'); if (s) s.remove(); return prevStart && prevStart(...a); };
  document.addEventListener('click', (ev) => {
    if (gameStarted || stallTimer || !ev.target.closest || !ev.target.closest('.ejs_start_button')) return;
    stallTimer = setTimeout(() => {
      if (gameStarted) return;
      const box = document.createElement('div'); box.id = 'kpStall';
      box.style.cssText = 'position:absolute;inset:0;z-index:1600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:rgba(0,0,0,.75);color:#e4e9f0';
      box.innerHTML = '<p style="margin:0;max-width:320px">The game player is taking longer than usual to start. Reloading usually fixes it. If it keeps happening, close the app completely and open it again.</p>';
      const btn = document.createElement('button'); btn.className = 'barbtn'; btn.textContent = 'Reload'; btn.style.pointerEvents = 'auto';
      btn.onclick = () => location.reload();
      box.append(btn); document.querySelector('.gamebox').append(box);
    }, 40000);
  }, true);
})();
</script>
</body>
</html>
