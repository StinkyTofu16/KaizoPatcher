<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KaizoPatcher</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KaizoPatcher">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Layout: the emulator fills the screen under a slim bar with Menu and New run. Single dark look. */
:root { --bg: #000; --bar: #0d1117; --ink: #e4e9f0; --muted: #98a3b3; --accent: #7d9bff; --warn: #f0b75c; --bad: #ff8f86; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; overscroll-behavior: none; }
[hidden] { display: none !important; }
.shell { position: fixed; inset: 0; display: flex; flex-direction: column; }
.bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--bar);
  padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: 6px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.bar .info { font-size: .82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar .info b { color: var(--ink); font-weight: 600; }
.bar button, .bar a { font: 600 .88rem system-ui, -apple-system, sans-serif; color: var(--accent); background: transparent; border: 1.5px solid #2e3845; border-radius: 8px; padding: 7px 12px; min-height: 36px; text-decoration: none; white-space: nowrap; cursor: pointer; }
.bar button.armed { color: #0d1422; background: var(--warn); border-color: var(--warn); }
.bar button:focus-visible, .bar a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stage { flex: 1; min-height: 0; position: relative; padding-bottom: env(safe-area-inset-bottom, 0px); }
#game { width: 100%; height: 100%; }
.msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); }
.msg.bad { color: var(--bad); }
</style>
</head>
<body>
<div class="shell">
  <div class="bar">
    <a href="play.html" id="menuBtn">Menu</a>
    <span class="info" id="info"></span>
    <button id="newBtn">New run</button>
  </div>
  <div class="stage">
    <div id="game"></div>
    <div class="msg" id="msg">Loading your run…</div>
  </div>
</div>
<script src="kp-store.js"></script>
<script>
const EJS_VERSION_PATH = 'https://cdn.emulatorjs.org/4.2.3/data/';
(async () => {
  const $ = (id) => document.getElementById(id);
  let setup, run;
  try { setup = await KPStore.get('setup'); run = await KPStore.get('run'); } catch (e) {}
  if (!setup || !run) { location.replace('play.html'); return; }
  $('info').innerHTML = '';
  const b = document.createElement('b'); b.textContent = 'Run #' + run.id;
  $('info').append(b, document.createTextNode(' · ' + run.preset));

  const saveNow = () => { try { window.EJS_emulator && EJS_emulator.started && EJS_emulator.gameManager.saveSaveFiles(); } catch (e) {} };
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  window.addEventListener('pagehide', saveNow);
  $('menuBtn').addEventListener('click', (e) => { e.preventDefault(); saveNow(); setTimeout(() => { location.href = 'play.html'; }, 400); });

  let armed = false, t = null;
  $('newBtn').addEventListener('click', () => {
    if (!armed) {
      armed = true; $('newBtn').textContent = 'Tap again to end run'; $('newBtn').classList.add('armed');
      t = setTimeout(() => { armed = false; $('newBtn').textContent = 'New run'; $('newBtn').classList.remove('armed'); }, 4000);
      return;
    }
    clearTimeout(t); saveNow();
    $('newBtn').disabled = true; $('newBtn').textContent = 'Starting…';
    setTimeout(() => { location.href = 'play.html?new=1'; }, 400);
  });

  window.EJS_player = '#game';
  window.EJS_core = setup.core;
  window.EJS_gameUrl = new Blob([run.rom]);
  window.EJS_gameName = 'kp-run-' + run.id;
  window.EJS_pathtodata = EJS_VERSION_PATH;
  window.EJS_startOnLoaded = true;
  window.EJS_color = '#7d9bff';
  window.EJS_backgroundColor = '#000000';
  window.EJS_defaultOptions = { 'save-save-interval': '30' };
  window.EJS_Buttons = { restart: false, netplay: false, exitEmulation: false, cacheManager: false, cheat: false };
  window.EJS_ready = () => { $('msg').hidden = true; };
  window.EJS_onGameStart = () => { $('msg').hidden = true; };
  const sc = document.createElement('script');
  sc.src = EJS_VERSION_PATH + 'loader.js';
  sc.onerror = () => { $('msg').className = 'msg bad'; $('msg').textContent = 'Couldn’t load the game player. Check your connection and reload.'; };
  document.body.append(sc);
  setTimeout(() => { if (!$('msg').classList.contains('bad')) $('msg').hidden = true; }, 4000);
})();
</script>
</body>
</html>
